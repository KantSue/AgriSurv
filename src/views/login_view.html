<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Formulaire Paysan</title>
</head>

<body>
    <h1>Créer un paysan</h1>

    <form id="signupForm">
        <label>Nom : <input type="text" name="nom" required></label><br><br>
        <label>Prénom : <input type="text" name="prenom" required></label><br><br>
        <label>Téléphone : <input type="text" name="tel" required></label><br><br>
        <label>Localisation : <input type="text" name="localisation" required></label><br><br>
        <label>Mot de passe : <input type="password" name="mdp" required></label><br><br>
        <button type="submit">Créer</button>
        
    </form>

    <div id="message"></div>

    <script>
        const form = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('http://localhost:3000/login/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error('Erreur serveur');

                const result = await response.json();
                messageDiv.textContent = JSON.stringify(result);
            } catch (err) {
                messageDiv.textContent = err.message;
                console.error(err);
            }
        });
    </script>
</body>

</html>
