<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test OpenWeather API</title>
</head>
<body>

  <h2>Test OpenWeather API</h2>

  <input type="text" id="ville" placeholder="Entrer une ville (ex: Antananarivo)">
  <button onclick="OpenWeatherApi()">Tester</button>

  <pre id="resultat"></pre>

  <script>
    const cleapi = "TA_CLE_API_ICI"; // 🔴 mets ta vraie clé API ici

    // exemple simple de traduction
    const descriptionsMG = {
      "clear sky": "Lanitra mazava",
      "few clouds": "Rahona vitsy",
      "scattered clouds": "Rahona miparitaka",
      "broken clouds": "Rahona maro",
      "light rain": "Orana malefaka",
      "overcast clouds":"rahona matevina"
    };

    function OpenWeatherApi() {
      const localisation = document.getElementById("ville").value;

      if (!localisation) {
        alert("Entrer une ville");
        return;
      }

      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${localisation}&appid=c439e2357d3d29c6f7770157bc6b6df3&units=metric`)
        .then(response => {
          if (!response.ok) {
            throw new Error("Erreur : " + response.status);
          }
          return response.json();
        })
        .then(data => {
          const descEng = data.weather[0].description;
          const descMg = descriptionsMG[descEng] || descEng;

          const resultat = {
            ville: data.name,
            temp_min: data.main.temp_min,
            temp_max: data.main.temp_max,
            humidite: data.main.humidity,
            vent: data.wind.speed,
            pluie: data.rain ? Object.values(data.rain)[0] : 0,
            description: descMg
          };

          document.getElementById("resultat").textContent =
            JSON.stringify(resultat, null, 2);

          console.log(resultat);
        })
        .catch(error => {
          console.error(error);
          document.getElementById("resultat").textContent = error.message;
        });
    }
  </script>

</body>
</html>
